<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="384" viewBox="0 0 1120 384" role="img" aria-labelledby="title desc">
  <title id="title">PattuBook</title>
  <desc id="desc">A personal lending ledger for Android. A sample balance card shows ₹540 outstanding.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#101b1a"/><stop offset="1" stop-color="#11151d"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#33df94" stop-opacity=".24"/><stop offset="1" stop-color="#33df94" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#79cfa8" stroke-opacity=".10"/></pattern>
    <clipPath id="clip"><rect width="1120" height="384" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="system-ui, sans-serif">
    <rect width="1120" height="384" fill="url(#bg)"/>
    <rect x="540" width="580" height="384" fill="url(#grid)"/>
    <ellipse cx="925" cy="173" rx="425" ry="255" fill="url(#glow)"/>
    <rect x="56" y="52" width="56" height="56" rx="16" fill="#16392d" stroke="#327557"/>
    <path d="M72 69h22v24H75a3 3 0 0 1-3-3V69Zm6 0v24m5-17h6m-6 6h6" fill="none" stroke="#72f0b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="130" y="86" fill="#91e9bd" font-size="16" font-weight="700" letter-spacing="3">ANDROID LENDING LEDGER</text>
    <text x="52" y="191" fill="#f3faf7" font-size="87" font-weight="800" letter-spacing="-4">PattuBook</text>
    <text x="58" y="244" fill="#c2d5d0" font-size="27">See who owes what at a glance.</text>
    <text x="58" y="283" fill="#9eb3b0" font-size="20">Track money given, repayments, and balances.</text>
    <path d="M58 323h43" stroke="#65eeb0" stroke-width="3" stroke-linecap="round"/>
    <text x="116" y="328" fill="#a6d6be" font-size="14" font-weight="700" letter-spacing="2.5">STORED ON DEVICE</text>
    <rect x="678" y="83" width="368" height="247" rx="24" fill="#0a1216" opacity=".6"/>
    <rect x="662" y="67" width="368" height="247" rx="24" fill="#19262b" stroke="#39534c"/>
    <text x="693" y="106" fill="#a9c6bb" font-size="14" font-weight="700" letter-spacing="2">SAMPLE LEDGER</text>
    <text x="689" y="177" fill="#76f1b5" font-size="61" font-weight="800">₹540</text>
    <text x="694" y="205" fill="#c1d0d3" font-size="18">Outstanding</text>
    <path d="M694 233h304" stroke="#39534c"/>
    <circle cx="701" cy="260" r="5" fill="#70edb1"/>
    <text x="715" y="266" fill="#dcece6" font-size="16">Given</text>
    <text x="998" y="266" fill="#dcece6" font-size="16" text-anchor="end">₹1,200</text>
    <circle cx="701" cy="286" r="5" fill="#83bfff"/>
    <text x="715" y="292" fill="#dcece6" font-size="16">Returned</text>
    <text x="998" y="292" fill="#dcece6" font-size="16" text-anchor="end">₹660</text>
  </g>
  <rect x=".5" y=".5" width="1119" height="383" rx="29.5" fill="none" stroke="#39534c"/>
</svg>
